[package]
name = "pglz"
version = "0.1.0"
edition = "2024"
license = "PostgreSQL"
description = "Port of PostgreSQL's pglz compressor with sync and async APIs"
repository = "https://github.com/serprex/pglz-rs"
readme = "README.md"
keywords = ["pglz", "postgres", "postgresql", "compression"]
categories = ["compression"]

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
